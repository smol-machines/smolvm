[package]
name = "smolvm-network"
version = "1.35.0"
edition = "2021"
description = "Host-side virtio-net runtime for smolvm"
license = "Apache-2.0"
repository = "https://github.com/smol-machines/smolvm"
readme = "README.md"

[dependencies]
crossbeam-queue = "0.3"
getrandom = "0.3"
humantime = "2"
libc = "0.2"
krun-socket = { git = "https://github.com/smol-machines/libkrun", rev = "4d910e78891e657072abf9c5de7c7c9af2b63f08" }
polling = "3"
serde_json = "1"
smolvm-protocol = { path = "../smolvm-protocol", version = "1.26.1" }
smoltcp = { package = "smolvm-smoltcp", path = "../../vendor/smoltcp", version = "=0.13.1-smol.1", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    # Keep the 1500-byte link MTU while carrying complete IPv4 UDP datagrams.
    # Reassembly allocates lazily, with at most sixteen in-flight packets.
    "proto-ipv4-fragmentation",
    "fragmentation-buffer-size-65536",
    "reassembly-buffer-count-16",
    "assembler-max-segment-count-32",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    # Raw IP sockets capture the guest's ICMP echo traffic so the gateway can
    # relay ping to real host ICMP sockets (see `icmp_relay`).
    "socket-raw",
    # The gateway interface owns three addresses: IPv4, IPv6 ULA, and the
    # IPv6 link-local (default cap is 2).
    "iface-max-addr-count-3",
] }
sha2 = "0.10"
socket2 = "0.6"
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[features]
# Exposes fuzz-only entrypoints (e.g. fuzz_classify_guest_frame). Never enabled in normal builds.
fuzzing = []
