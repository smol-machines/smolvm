  <h1>smolvm pacman repository</h1>
  <p>Add this repository to <code>/etc/pacman.conf</code>:</p>
  <pre>[smol-machines]
SigLevel = Optional TrustAll
Server = https://smol-machines.github.io/smolvm/pacman/$arch</pre>
  <p>Then run <code>sudo pacman -Sy smolvm</code>.</p>
