[package]
name = "smolvm-tar"
version = "0.4.46-smol.1"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
homepage = "https://github.com/composefs/tar-rs"
repository = "https://github.com/smol-machines/smolvm"
documentation = "https://docs.rs/smolvm-tar"
license = "MIT OR Apache-2.0"
keywords = ["tar", "tarfile", "encoding"]
readme = false
edition = "2021"
rust-version = "1.63"
include = ["src/**", "tests/**", "examples/**", "LICENSE-*", "Cargo.toml", "Cargo.lock"]

description = """
A Rust implementation of a TAR file reader and writer. This library does not
currently handle compression, but it is abstract over all I/O readers and
writers. Additionally, great lengths are taken to ensure that the entire
contents are never required to be entirely resident in memory all at once.
"""

[dependencies]
filetime = "0.2.8"

[dev-dependencies]
astral-tokio-tar = "0.6.2"
rand = { version = "0.8", features = ["small_rng"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"

[target."cfg(unix)".dependencies]
xattr = { version = "1.1.3", optional = true }
libc = "0.2"

[features]
default = ["xattr"]

[lints.rust]
# Feel free to comment this one out locally during development of a patch.
dead_code = "deny"

[lib]
name = "tar"

[package.metadata.smolvm]
upstream-version = "0.4.46"
upstream-revision = "38451cc19418dac850e46e9dc6fac0fae1247940"
upstream-fix = "https://github.com/composefs/tar-rs/pull/476"
