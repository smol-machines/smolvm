name: tmp mini2 clean
on:
  push:
    branches: [tmp-mini2-clean]
jobs:
  clean:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Remove stale QA scratch from the home directory
        run: |
          df -h /System/Volumes/Data | tail -1
          open_now=$(lsof -Fn 2>/dev/null | sed -n 's/^n//p' | grep "^$HOME/" | cut -d/ -f1-4 | sort -u)
          n=0
          for p in "$HOME"/*; do
            name=$(basename "$p")
            case "$name" in actions-runner|Library|Desktop|Documents|Downloads|Movies|Music|Pictures|Public|Applications) continue;; esac
            [ -e "$p/.git" ] && { echo "keep (git) $name"; continue; }
            [ -n "$(find "$p" -maxdepth 0 -mmin -1440)" ] && { echo "keep (recent) $name"; continue; }
            echo "$open_now" | grep -qxF "$p" && { echo "keep (open) $name"; continue; }
            chmod -R u+w "$p" 2>/dev/null; rm -rf "$p" 2>/dev/null && { echo "removed $name"; n=$((n+1)); }
          done
          echo "removed $n entries"
          df -h /System/Volumes/Data | tail -1
