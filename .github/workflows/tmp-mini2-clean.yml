name: tmp mini2 clean
on:
  push:
    branches: [tmp-mini2-clean]
jobs:
  clean:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - name: Free build output and measure the rest
        run: |
          df -h /System/Volumes/Data | tail -1
          for t in ~/actions-runner/_work/*/*/target; do [ -d "$t" ] && { echo "removing $t"; rm -rf "$t"; }; done
          df -h /System/Volumes/Data | tail -1
          echo "== largest files (Spotlight)"
          mdfind -onlyin "$HOME" 'kMDItemFSSize > 2000000000' 2>/dev/null | head -40 | while read -r f; do echo "$(stat -f %z "$f" 2>/dev/null | awk '{printf "%.1f GB", $1/1073741824}') $(stat -f %Sm -t %Y-%m-%d "$f" 2>/dev/null) $f"; done | sort -rn | head -30
          echo "== top-level sizes"
          for d in ~/.smolvm ~/Documents ~/Downloads; do (perl -e 'alarm 900; exec @ARGV' du -d 2 -x -h "$d" 2>/dev/null | sort -rh | head -12 > "/tmp/du-$(basename $d).txt"; echo done) & done; wait
          cat /tmp/du-.smolvm.txt /tmp/du-Documents.txt /tmp/du-Downloads.txt
          df -h /System/Volumes/Data | tail -1
