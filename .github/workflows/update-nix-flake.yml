name: Update Nix flake

# Bumps nix/smolvm.nix (version + per-arch SRI hashes) to a release and opens a
# PR. Invoked by release.yml (workflow_call) after the release exists, because
# the `release: published` event never fires for a GITHUB_TOKEN release — the
# same restriction the pacman / deb-rpm / Homebrew steps work around. Opens a PR
# rather than pushing to main so the flake bump gets a normal review.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to pin (e.g. v1.5.2)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to pin (e.g. v1.5.2)'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # From main, not the tag: a release tag sits on its release branch, whose
      # version bumps must not reach main through this PR.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump nix/smolvm.nix
        id: bump
        run: |
          set -euo pipefail
          TAG='${{ github.event.release.tag_name || inputs.tag }}'
          VER="${TAG#v}"
          python3 packaging/nix/bump.py "$VER" nix/smolvm.nix
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git diff --quiet nix/smolvm.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bump PR
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ver='${{ steps.bump.outputs.ver }}'
          branch="nix-bump-${ver}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add nix/smolvm.nix
          git commit -m "chore(nix): bump flake to ${ver}"
          git push -f origin "$branch"
          title="chore(nix): bump flake to ${ver}"
          body="Automated bump of nix/smolvm.nix to ${ver} (version + per-arch SRI hashes)."
          # Opening the PR is best-effort: the default GITHUB_TOKEN can't create PRs
          # unless the repo's "Allow GitHub Actions to create and approve pull requests"
          # setting is on. The bump branch is already pushed, so don't red-fail the
          # release over a blocked create — update an existing PR if there is one, else
          # surface a one-click compare link and exit clean.
          if gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            echo "Opened bump PR for $branch"
          elif gh pr edit "$branch" --title "$title" >/dev/null 2>&1; then
            echo "Updated existing bump PR for $branch"
          else
            echo "::warning title=nix bump PR not opened::GITHUB_TOKEN is blocked from creating PRs; branch '${branch}' is pushed — open it at ${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
          fi
          # GitHub holds the checks of a PR the workflow token opened for a
          # maintainer's approval (action_required), and a check run started any
          # other way does not count for the PR, so every bump from 1.34.2 to
          # 1.35.2 sat unmergeable and was closed while the flake stayed broken.
          # Approve the held runs on the bump's head so its checks run now.
          head=$(git rev-parse HEAD)
          approved=0
          for _ in $(seq 1 12); do
            sleep 10
            for id in $(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${head}&status=action_required" --jq '.workflow_runs[].id'); do
              if gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/approve" >/dev/null; then approved=$((approved + 1)); fi
            done
            [ "$approved" -gt 0 ] && break
          done
          if [ "$approved" -eq 0 ]; then
            echo "::warning title=nix bump checks not started::no held check run on ${branch} could be approved; approve them on the PR, or close and reopen it, so the flake bump can merge"
          fi
