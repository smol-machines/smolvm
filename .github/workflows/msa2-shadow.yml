name: msa2 shadow
# The Linux (x86_64) job of ci.yml, run again on an owned MS-A2 (Ryzen 9 9955HX) for every push to main, to compare it
# with the smol runner that CI uses. It never gates anything; each run prints a BENCH line (commit, start, end) that the
# comparison pairs with ci.yml's job for the same commit. target/ persists on the machine between runs, as it does on a
# warm smol runner. Never runs for pull requests.
on:
  push:
    branches: [main, binbin-msa2-shadow]
  workflow_dispatch:

concurrency:
  group: msa2-shadow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux (x86_64) on msa2
    runs-on: msa2
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
      LIBRARY_PATH: /usr/local/lib
      LD_LIBRARY_PATH: /usr/local/lib
      CARGO_TARGET_DIR: /home/runner/_work/msa2-target
    steps:
      - name: Start
        run: echo "start=$(date +%s.%N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ env.TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev pkg-config >/dev/null

      - name: Create libkrun stub for linking
        run: |
          cat > /tmp/libkrun_stub.c << 'EOF'
          int krun_create_ctx() { return -1; }
          int krun_free_ctx(int ctx) { return 0; }
          int krun_set_vm_config(int ctx, int cpus, int mem) { return -1; }
          int krun_set_root(int ctx, const char* path) { return -1; }
          int krun_set_workdir(int ctx, const char* path) { return -1; }
          int krun_set_exec(int ctx, const char* path, char** argv, char** env) { return -1; }
          int krun_start_enter(int ctx) { return -1; }
          int krun_set_log_level(int level) { return 0; }
          int krun_add_disk2(int ctx, const char* id, const char* path, int flags, int ro) { return -1; }
          int krun_set_port_map(int ctx, char** map) { return -1; }
          int krun_add_vsock_port(int ctx, int port, const char* path) { return -1; }
          int krun_add_vsock_port2(int ctx, int port, const char* path, int flags) { return -1; }
          int krun_disable_implicit_vsock(int ctx) { return -1; }
          int krun_add_vsock(int ctx, int tsi_features) { return -1; }
          int krun_set_passt_fd(int ctx, int fd) { return -1; }
          int krun_add_virtiofs(int ctx, const char* tag, const char* path) { return -1; }
          int krun_add_virtiofs2(int ctx, const char* tag, const char* path, int flags) { return -1; }
          int krun_set_console_output(int ctx, const char* path) { return -1; }
          int krun_add_virtio_console_default(int ctx) { return -1; }
          EOF
          gcc -shared -fPIC -o /tmp/libkrun.so /tmp/libkrun_stub.c
          sudo cp /tmp/libkrun.so /usr/local/lib/
          sudo ln -sf /usr/local/lib/libkrun.so /usr/local/lib/libkrun.1.dylib
          sudo ldconfig

      - name: Build
        run: cargo build --release --target $TARGET

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target $TARGET -- -D warnings

      - name: Run unit tests
        run: >
          cargo test --lib --target $TARGET
          -p smolvm -p smolvm-pack -p smolvm-registry
          -p smolvm-protocol -p smolfile -p smolvm-cuda -p smolvm-s3fs

      - name: Test TCP relay socket options
        run: |
          cargo test -p smolvm-network --lib --target $TARGET tcp_relay::tests::registered_relay_stream_disables_nagle_for_outbound_and_accepted_sockets -- --exact
          cargo test -p smolvm-network --lib --target $TARGET tcp_relay::tests::guest_relay_sockets_disable_nagle_for_outbound_and_published_connections -- --exact

      - name: Run agent unit tests
        run: cargo test -p smolvm-agent --bins --target $TARGET

      - name: Report
        if: always()
        run: |
          end=$(date +%s.%N)
          echo "BENCH repo=smolvm runner=msa2 sha=$GITHUB_SHA status=${{ job.status }} start=$start end=$end steps_s=$(awk -v s="$start" -v e="$end" 'BEGIN{printf "%.1f", e-s}')"
